name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check LSP formatting
      run: cargo fmt --manifest-path avon-lsp/Cargo.toml --all -- --check
    - name: Build
      run: cargo build --locked --release
    - name: Build LSP
      run: cargo build --manifest-path avon-lsp/Cargo.toml --locked --release
    - name: Run tests
      run: cargo test --locked --all-targets --all-features
    - name: Run LSP tests
      run: cargo test --manifest-path avon-lsp/Cargo.toml --locked --all-targets --all-features
    - name: Clippy (deny warnings)
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: LSP Clippy (deny warnings)
      run: cargo clippy --manifest-path avon-lsp/Cargo.toml --locked --all-targets --all-features -- -D warnings
    - name: Install Linux shell-test dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y jq perl python3
    - name: Run complete Linux shell suite
      if: runner.os == 'Linux'
      run: bash testing/run-all.sh --no-clean
